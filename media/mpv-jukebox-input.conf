# Xbox-style controller controls for the Super Kazeta MP3 Jukebox.
GAMEPAD_ACTION_DOWN cycle pause
GAMEPAD_ACTION_RIGHT quit
GAMEPAD_ACTION_LEFT playlist-prev
GAMEPAD_ACTION_UP script-binding jukebox_visualizer/cycle
GAMEPAD_START cycle pause
GAMEPAD_BACK quit
GAMEPAD_DPAD_LEFT seek -10
GAMEPAD_DPAD_RIGHT seek 10
GAMEPAD_DPAD_UP add volume 5
GAMEPAD_DPAD_DOWN add volume -5
GAMEPAD_LEFT_SHOULDER playlist-prev
GAMEPAD_RIGHT_SHOULDER playlist-next
GAMEPAD_LEFT_TRIGGER ignore
GAMEPAD_RIGHT_TRIGGER ignore

ENTER cycle pause
ESC quit
LEFT seek -10
RIGHT seek 10
UP add volume 5
DOWN add volume -5
PAGE_UP playlist-prev
PAGE_DOWN playlist-next
v script-binding jukebox_visualizer/cycle
