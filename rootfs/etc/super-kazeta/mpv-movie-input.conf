# PlayFusion movie controls (Xbox-style controller names used by MPV/SDL)
ESC quit
BS quit
GAMEPAD_BACK quit
GAMEPAD_B quit
GAMEPAD_A cycle pause
GAMEPAD_START cycle pause
GAMEPAD_DPAD_LEFT seek -10
GAMEPAD_DPAD_RIGHT seek 10
GAMEPAD_DPAD_UP add volume 5
GAMEPAD_DPAD_DOWN add volume -5
GAMEPAD_LEFT_SHOULDER seek -60
GAMEPAD_RIGHT_SHOULDER seek 60
GAMEPAD_LEFT_TRIGGER seek -5
GAMEPAD_RIGHT_TRIGGER seek 5
SPACE cycle pause
LEFT seek -10
RIGHT seek 10
UP add volume 5
DOWN add volume -5
f cycle fullscreen
